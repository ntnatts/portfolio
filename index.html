<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nat Suriyapanuwat — Portfolio</title>
<meta name="description" content="Portfolio of Nat Suriyapanuwat: risk models, analytics and LLM projects, plus a few blogs from off the clock.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23F2600C'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'>N</text></svg>">

<!-- Fonts: Newsreader (headings) + Inter Tight (everything else) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300..500&family=Inter+Tight:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

<!-- Apply the saved light/dark choice before the page paints (no flash) -->
<script>
  try {
    var t = localStorage.getItem("nat-theme");
    if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("dark");
  } catch (e) {}
</script>

<!-- Markdown renderer for blog posts (no build step) -->
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" defer></script>
<script type="module" src="js/main.js"></script>
</head>
<body>

<div class="clock" id="clock" aria-label="Time in Montréal"><span>MTL</span><b>--:--</b></div>

<nav class="nav" aria-label="Main">
  <a class="me" href="#"><span class="avatar" id="nav-initial">N</span><b id="nav-name">Nat Suriyapanuwat</b></a>
  <div class="links">
    <a href="#" data-go="work">Projects</a>
    <a href="#experience">Experience</a>
    <a href="#" data-go="approach">Approach</a>
    <a href="#" data-go="contact">Contact</a>
  </div>
  <button class="iconbtn" id="theme" aria-label="Toggle dark mode">
    <svg class="moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</nav>
<div class="glow" id="glow" aria-hidden="true"></div>

<!-- ============ HOME ============ -->
<main class="view" id="home">
  <header class="hero">
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
    <div class="herotext">
      <div class="eyebrow" id="hero-eyebrow"></div>
      <h1 class="name serif"><span class="rise"><span id="name-1"></span></span><span class="rise"><span id="name-2"></span></span></h1>
      <p class="role"><span id="tagline"></span> <span class="typed" id="typed"></span></p>
    </div>
    <div class="heroboard">
      <div class="board" id="board" role="list" aria-label="Off the clock: each emoji opens a blog"></div>
      <div class="boardcap" id="boardcap"></div>
    </div>
    <div class="scrollhint" aria-hidden="true"><i></i>Scroll to see the work</div>
  </header>

  <div class="projhead" id="work"><h2 class="eyebrow" style="margin:0">Projects</h2></div>
  <!-- Card deck effect adapted from "Project Deck" by Aakash Mehra -->
  <section class="deck" id="deck" aria-label="Projects"><div class="stage" id="stage"></div></section>

  <section class="about" id="approach">
    <h2 class="serif reveal"><span class="eyebrow">Approach</span><span id="approach-1"></span><br><em id="approach-2"></em></h2>
    <div class="reveal d1">
      <div id="approach-text"></div>
      <div class="eyebrow" style="margin:26px 0 4px">Toolkit</div>
      <div class="pills" id="toolkit"></div>
    </div>
  </section>
</main>

<!-- ============ OTHER PAGES (filled in by js/) ============ -->
<main class="view case" id="case"></main>
<main class="view blog" id="blog"></main>
<main class="view exp" id="exp"></main>

<footer id="contact">
  <p class="big serif reveal"><span id="contact-1"></span> <em id="contact-2"></em></p>
  <div class="links2" id="contact-links"></div>
  <div class="copy"><span id="copyright"></span><span id="credit"></span></div>
</footer>

<noscript><p class="error">This site needs JavaScript turned on.</p></noscript>
</body>
</html>
